# Ambiente de PRODUÇÃO (VPS).
#
# Usa a infraestrutura que já roda na VPS:
#   - Postgres: container "postgres" na rede "db_net"
#   - Redis:    container "redis"    na rede "db_net" (com senha; bancos 2 e 3,
#               os bancos 0 e 1 são de outra aplicação)
#   - Nginx Proxy Manager (rede "proxy") faz o TLS e encaminha para
#     http://azure-facilities:8080
#
# As migrations rodam sozinhas na subida (AUTORUN_LARAVEL_MIGRATION).
#
#   cp .env.production.example .env.production   # e preencha
#   docker compose -f docker-compose.prod.yml up -d --build

name: azure-facilities

services:
  app:
    build:
      context: .
      target: production
    image: azure-facilities:latest
    container_name: azure-facilities
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "8080"
    volumes:
      - storage:/var/www/html/storage/app
    networks:
      - proxy
      - db_net

volumes:
  storage:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
  db_net:
    external: true
    name: ${BACKEND_NETWORK:-db_net}
