# Ambiente de DESENVOLVIMENTO.
#   docker compose up -d
#   app:  http://localhost:8000
#   vite: http://localhost:5173 (HMR)
# Produção: ver docker-compose.prod.yml

name: azure-facilities

services:
  app:
    build:
      context: .
      target: development
      args:
        USER_ID: ${HOST_UID:-1000}
        GROUP_ID: ${HOST_GID:-1000}
    ports:
      - "${APP_PORT:-8000}:8080"
    volumes:
      - .:/var/www/html
    environment:
      PHP_OPCACHE_ENABLE: "0"
      SSL_MODE: "off"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started

  vite:
    image: node:22-alpine
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: sh -c "npm install && npm run dev"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/app
    environment:
      VITE_DOCKER: "1"

  pgsql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-azure_facilities}
      POSTGRES_USER: ${DB_USERNAME:-azure_facilities}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-azure_facilities} -d ${DB_DATABASE:-azure_facilities}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

volumes:
  pgsql-data:
  redis-data:
